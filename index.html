<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกประวัติการซ่อม Gantry Crane - เชียงราย</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/30 z-50 flex items-center justify-center">
        <div class="bg-white p-4 rounded-xl shadow-lg flex items-center gap-3">
            <svg class="animate-spin h-5 w-5 text-amber-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span class="text-sm font-medium">กำลังโหลดข้อมูลจากชีต2...</span>
        </div>
    </div>

    <!-- App Container -->
    <div id="app" class="max-w-4xl mx-auto p-4 md:p-6">

        <!-- 1. LOGIN SCREEN -->
        <div id="screen-login" class="bg-white rounded-2xl shadow-xl p-8 max-w-md mx-auto mt-12">
            <div class="text-center mb-6">
                <span class="bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">ระบบจัดการซ่อมบำรุง</span>
                <h1 class="text-2xl font-bold mt-2 text-slate-900">Gantry Crane</h1>
                <p class="text-sm text-slate-500">ลานผลิต Parapet โครงการเชียงราย</p>
            </div>
            
            <form id="loginForm" onsubmit="handleMechanicLogin(event)" class="space-y-4">
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <h2 class="text-sm font-bold text-slate-700 flex items-center gap-2">
                        <svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        เข้าสู่ระบบสำหรับช่างซ่อม
                    </h2>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ช่างผู้ทำการซ่อม</label>
                        <select id="mechanicName" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none" required>
                            <option value="นาย ฉัตร จันทร์โชติ">นาย ฉัตร จันทร์โชติ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">รหัสผ่าน (PIN)</label>
                        <input type="password" id="mechanicPin" placeholder="กรอกรหัสผ่าน (0532)" maxlength="4" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm bg-white focus:ring-2 focus:ring-amber-500 focus:outline-none tracking-widest text-center" required>
                    </div>
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-sm text-sm">
                        เข้าสู่ระบบ (ช่างซ่อม)
                    </button>
                </div>
            </form>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-xs">หรือ</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <button onclick="handleVisitorLogin()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-3 rounded-lg transition duration-200 border border-slate-300 flex items-center justify-center gap-2 text-sm shadow-sm">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                เข้าชมระบบสำหรับ Visitor (ดูประวัติเท่านั้น)
            </button>
        </div>

        <!-- 2. DASHBOARD / MAIN MENU -->
        <div id="screen-main" class="hidden">
            <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <span id="userBadge" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">Role</span>
                    <h1 class="text-xl font-bold mt-1">Gantry Crane (ลานผลิต Parapet เชียงราย)</h1>
                    <p class="text-xs text-slate-500">ผู้ใช้งาน: <span id="displayUserName" class="font-medium"></span></p>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="loadHistory()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg transition flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        รีเฟรชข้อมูล
                    </button>
                    <button onclick="logout()" class="text-sm text-red-600 hover:text-red-800 font-medium px-4 py-2 border border-red-200 rounded-lg hover:bg-red-50 transition">
                        ออกจากระบบ
                    </button>
                </div>
            </div>

            <!-- Action Tabs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <button id="tabBtnRepair" onclick="switchTab('repair')" class="p-6 bg-white rounded-xl shadow-sm border-2 border-transparent hover:border-amber-500 text-left transition flex items-center gap-4 group">
                    <div class="p-3 rounded-lg bg-amber-100 text-amber-600 group-hover:bg-amber-600 group-hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg">บันทึกการซ่อมแซม</h3>
                        <p class="text-sm text-slate-500">เลือกอะไหล่ ราคา และแนบรูปภาพการซ่อม</p>
                    </div>
                </button>

                <button onclick="switchTab('history')" class="p-6 bg-white rounded-xl shadow-sm border-2 border-transparent hover:border-blue-500 text-left transition flex items-center gap-4 group">
                    <div class="p-3 rounded-lg bg-blue-100 text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    </div>
                    <div>
                        <h3 class="font-bold text-lg">ดูประวัติการซ่อม</h3>
                        <p class="text-sm text-slate-500">ตรวจสอบรายการซ่อมทั้งหมด พร้อมรายละเอียด</p>
                    </div>
                </button>
            </div>

            <!-- SECTION: REPAIR FORM -->
            <div id="section-repair" class="bg-white rounded-2xl shadow-sm p-6 mb-6">
                <h2 class="text-lg font-bold mb-4 border-b pb-2 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span> บันทึกข้อมูลการซ่อมเครน (ชีต2)
                </h2>
                <form id="repairForm" onsubmit="saveRepair(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">วันที่ทำการซ่อม</label>
                            <input type="date" id="repairDate" required class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">อาการเสีย / รายละเอียดเบื้องต้น</label>
                            <input type="text" id="repairIssue" placeholder="เช่น รอกไฟฟ้าติดขัด, ลวดสลิงชำรุด" required class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="border rounded-xl p-4 bg-slate-50 space-y-3">
                        <label class="block text-sm font-bold text-slate-700">รายการอะไหล่ที่เปลี่ยน / ซ่อมแซม</label>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div class="md:col-span-2">
                                <input type="text" id="partName" placeholder="ชื่ออะไหล่ (เช่น ลวดสลิง 12มม.)" class="w-full rounded-lg border border-slate-300 p-2 bg-white">
                            </div>
                            <div>
                                <input type="number" id="partPrice" placeholder="ราคา (บาท)" class="w-full rounded-lg border border-slate-300 p-2 bg-white">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">แนบรูปภาพการซ่อม</label>
                        <input type="file" id="repairImage" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">หมายเหตุเพิ่มเติม</label>
                        <textarea id="repairNote" rows="2" placeholder="รายละเอียดเพิ่มเติม..." class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-3 rounded-lg transition shadow">
                        บันทึกประวัติการซ่อม (ส่งเข้าชีต2)
                    </button>
                </form>
            </div>

            <!-- SECTION: HISTORY LIST -->
            <div id="section-history" class="bg-white rounded-2xl shadow-sm p-6 hidden">
                <h2 class="text-lg font-bold mb-4 border-b pb-2 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span> ประวัติการซ่อมทั้งหมด (ชีต2 Real-Time)
                </h2>
                <div id="historyList" class="space-y-4">
                    <!-- Data will be loaded here -->
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic with SheetDB API (Targeting ชีต2) -->
    <script>
        // กำหนด URL พร้อมพารามิเตอร์ระบุชื่อชีสเป็น "ชีต2"
        const SHEET_API_URL = 'https://sheetdb.io/api/v1/phqskeea5cfet?sheet=%E0%B8%88%E0%B8%B5%E0%B8%952';

        let currentUser = null;
        document.getElementById('repairDate').valueAsDate = new Date();

        function showLoading(show) {
            const loader = document.getElementById('loadingOverlay');
            if(show) loader.classList.remove('hidden');
            else loader.classList.add('hidden');
        }

        function handleMechanicLogin(e) {
            e.preventDefault();
            const name = document.getElementById('mechanicName').value;
            const pin = document.getElementById('mechanicPin').value;

            if(pin !== '0532') {
                alert('รหัสผ่านไม่ถูกต้อง! (รหัสผ่านคือ 0532)');
                return;
            }

            currentUser = { role: 'mechanic', name: name };
            localStorage.setItem('gantry_current_user', JSON.stringify(currentUser));
            updateUI();
        }

        function handleVisitorLogin() {
            currentUser = { role: 'visitor', name: 'ผู้เยี่ยมชม (Visitor)' };
            localStorage.setItem('gantry_current_user', JSON.stringify(currentUser));
            updateUI();
        }

        function logout() {
            localStorage.removeItem('gantry_current_user');
            currentUser = null;
            document.getElementById('loginForm').reset();
            updateUI();
        }

        function updateUI() {
            const savedUser = localStorage.getItem('gantry_current_user');
            if(savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('screen-login').classList.add('hidden');
                document.getElementById('screen-main').classList.remove('hidden');
                document.getElementById('displayUserName').innerText = currentUser.name;
                document.getElementById('userBadge').innerText = currentUser.role === 'mechanic' ? 'ช่างซ่อมบำรุง' : 'Visitor';

                const repairTabBtn = document.getElementById('tabBtnRepair');
                if(currentUser.role === 'visitor') {
                    repairTabBtn.style.opacity = '0.5';
                    repairTabBtn.style.pointerEvents = 'none';
                    switchTab('history');
                } else {
                    repairTabBtn.style.opacity = '1';
                    repairTabBtn.style.pointerEvents = 'auto';
                    switchTab('repair');
                }
                loadHistory();
            } else {
                document.getElementById('screen-login').classList.remove('hidden');
                document.getElementById('screen-main').classList.add('hidden');
            }
        }

        function switchTab(tab) {
            const repairSec = document.getElementById('section-repair');
            const historySec = document.getElementById('section-history');

            if(tab === 'repair' && currentUser.role === 'mechanic') {
                repairSec.classList.remove('hidden');
                historySec.classList.add('hidden');
            } else {
                repairSec.classList.add('hidden');
                historySec.classList.remove('hidden');
                loadHistory();
            }
        }

        async function saveRepair(e) {
            e.preventDefault();
            showLoading(true);

            const date = document.getElementById('repairDate').value;
            const issue = document.getElementById('repairIssue').value;
            const partName = document.getElementById('partName').value || '-';
            const partPrice = document.getElementById('partPrice').value || '0';
            const note = document.getElementById('repairNote').value || '-';
            const imageFile = document.getElementById('repairImage').files[0];

            const sendDataToSheet = async (imageUrl = '') => {
                const newRecord = {
                    id: String(Date.now()),
                    date: date,
                    issue: issue,
                    partName: partName,
                    partPrice: String(partPrice),
                    note: note,
                    imageUrl: imageUrl,
                    mechanic: currentUser.name,
                    timestamp: new Date().toLocaleString()
                };

                try {
                    const response = await fetch(SHEET_API_URL, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ data: [newRecord] })
                    });

                    if(response.ok) {
                        alert('บันทึกประวัติการซ่อมเข้าชีต2 สำเร็จ!');
                        document.getElementById('repairForm').reset();
                        document.getElementById('repairDate').valueAsDate = new Date();
                        switchTab('history');
                    } else {
                        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
                    }
                } catch (error) {
                    console.error(error);
                    alert('ไม่สามารถเชื่อมต่อกับ SheetDB ได้');
                } finally {
                    showLoading(false);
                }
            };

            if(imageFile) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    sendDataToSheet(uploadEvent.target.result);
                };
                reader.readAsDataURL(imageFile);
            } else {
                sendDataToSheet('');
            }
        }

        async function loadHistory() {
            showLoading(true);
            const historyList = document.getElementById('historyList');

            try {
                const response = await fetch(SHEET_API_URL);
                const history = await response.json();

                if(!Array.isArray(history) || history.length === 0) {
                    historyList.innerHTML = `<p class="text-center text-slate-400 py-8">ยังไม่มีประวัติการซ่อมแซมในชีต2</p>`;
                    showLoading(false);
                    return;
                }

                history.sort((a, b) => Number(b.id || 0) - Number(a.id || 0));

                historyList.innerHTML = history.map(item => `
                    <div class="border rounded-xl p-4 bg-slate-50 flex flex-col md:flex-row gap-4 items-start">
                        ${item.imageUrl ? `<img src="${item.imageUrl}" class="w-full md:w-32 h-32 object-cover rounded-lg border">` : '<div class="w-full md:w-32 h-32 bg-slate-200 rounded-lg flex items-center justify-center text-xs text-slate-400">ไม่มีรูปภาพ</div>'}
                        <div class="flex-1 space-y-1">
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-semibold px-2 py-0.5 bg-amber-100 text-amber-800 rounded">วันที่ซ่อม: ${item.date}</span>
                                <span class="text-xs text-slate-400">บันทึกโดย: ${item.mechanic}</span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-lg">อาการ: ${item.issue}</h3>
                            <p class="text-sm text-slate-600"><strong>อะไหล่:</strong> ${item.partName} | <strong>ราคา:</strong> <span class="text-amber-600 font-semibold">${Number(item.partPrice || 0).toLocaleString()} บาท</span></p>
                            <p class="text-sm text-slate-500"><strong>หมายเหตุ:</strong> ${item.note}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
                historyList.innerHTML = `<p class="text-center text-red-400 py-8">ไม่สามารถโหลดข้อมูลจากชีต2 ได้</p>`;
            } finally {
                showLoading(false);
            }
        }

        window.onload = updateUI;
    </script>
</body>
</html>
